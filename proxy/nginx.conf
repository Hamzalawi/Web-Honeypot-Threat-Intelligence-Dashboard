worker_processes 4;

events{
    worker_connections 512;
}

http{
    include mime.types;

    server_tokens off;   # remove nginx version 
    client_max_body_size 1M;

    # Creates a 10MB memory zone to track IPs, limiting them to 5 requests per second
    limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=5r/s;

    limit_req_zone $binary_remote_addr zone=honeypot_limit:10m rate=30r/s;


    #What happens when a user try to access another vhost (mandatory).
    server{   
        listen 8080 default_server;
        server_name _;

        return 444;
    }   



    server{

        listen 8080;
        server_name honeypot.localhost;
        limit_req zone=honeypot_limit burst=50 nodelay;

        location / {
            proxy_pass http://honeypot:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server{
        listen 8080;
        server_name dashboard.localhost;
        limit_req zone=dashboard_limit burst=10 nodelay;

        location /{
            proxy_pass http://dashboard_frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}