worker_processes auto;

events {
    worker_connections 512;
}

http {
    include mime.types;
    server_tokens off;
    client_max_body_size 1M;

    # Basic slow-request protection — exposed honeypots get probed with
    # slowloris-style connections fairly often
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=honeypot_limit:10m rate=30r/s;

    # Catches domain traffic AND raw-IP/unmatched-hostname traffic —
    # maximizes what the honeypot sees
    server {
        listen 8080 default_server;
        server_name honeypot.zguir.me _;
        limit_req zone=honeypot_limit burst=50 nodelay;

        location / {
            proxy_pass http://honeypot:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Routes traffic for dashboard.zguir.me — commented out while
    # dashboard containers are stopped (see prior note on reload cost)
    # server {
    #     listen 8080;
    #     server_name dashboard.zguir.me;
    #     limit_req zone=dashboard_limit burst=10 nodelay;
    #
    #     location / {
    #         proxy_pass http://dashboard_frontend:8000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}